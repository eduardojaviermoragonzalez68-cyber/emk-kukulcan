<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EMK KUKULCAN - NETFLIX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#0b0c10; color:#fff; }
    .netflix-row {
      display:flex;
      gap:15px;
      overflow-x:auto;
      padding-bottom:20px;
    }
    .video-card {
      min-width:280px;
      background:#151a21;
      border-radius:1.2rem;
      overflow:hidden;
      border:1px solid #333;
      flex: 0 0 auto;
    }
    .video-card video {
      width:100%;
      height:360px;
      object-fit:cover;
    }
    .tag {
      background:#ffdd00;
      color:#000;
      padding:4px 10px;
      border-radius:50px;
      font-weight:800;
      font-size:11px;
    }
  </style>
</head>
<body>

<nav class="p-3" style="background:#111; border-bottom:1px solid #222;">
  <b>EMK <span style="color:#ffdd00;">KUKULCAN</span></b>
</nav>

<div class="container py-4 text-center">
  <div style="border:2px solid #ffdd00; border-radius:1.5rem; padding:1.5rem;">
    <h2 style="color:#ffdd00;" class="fw-bold">ESTUDIO MORA KUKULCAN</h2>
    <p>9997646962 - Kanasín</p>
    <p><b>Eduardo Mora</b> - Polo, Gorras 3D, Tazas</p>
    <b style="color:#ffdd00;">👉 Desliza como Netflix 👉</b>
  </div>
</div>

<div class="container-fluid px-3 my-4">
  <h5 style="color:#ffdd00;" class="fw-bold">VIDEOS - DESLIZA →</h5>
  <div class="netflix-row mt-3">

    <div class="video-card">
      <video autoplay loop muted playsinline controls>
        <source src="polo-blanca.mp4">
      </video>
      <div class="text-center p-2">
        <span class="tag">VIDEO 1 - POLO BLANCA</span>
      </div>
    </div>

    <div class="video-card">
      <video autoplay loop muted playsinline controls>
        <source src="polo-azul.mp4">
      </video>
      <div class="text-center p-2">
        <span class="tag">VIDEO 2 - POLO AZUL</span>
      </div>
    </div>

    <div class="video-card">
      <video autoplay loop muted playsinline controls>
        <source src="intro-kukulcan.mp4">
      </video>
      <div class="text-center p-2">
        <span class="tag">VIDEO 3 - INTRO</span>
      </div>
    </div>

    <div class="video-card">
      <video autoplay loop muted playsinline controls>
        <source src="todo-en-uno.mp4">
      </video>
      <div class="text-center p-2">
        <span class="tag">VIDEO 4 - TODO EN UNO</span>
      </div>
    </div>

  </div>
</div>

<div class="text-center py-4 small" style="color:#666;">
  © 2026 EMK Kanasín
</div>

</body>
</html>
